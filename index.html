<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 入口导航</title>
<style>
:root{--main:#2456c4;--line:#e5e8ef;--bg:#f5f7fa;--txt:#333}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:#889;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;width:100%;max-width:960px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;transition:all .18s;position:relative}
.card:hover{border-color:var(--main);transform:translateY(-3px);box-shadow:0 8px 20px rgba(36,86,196,.1)}
.card .name{font-size:16px;font-weight:700;margin-bottom:6px}
.card .desc{font-size:12px;color:#889;line-height:1.6;margin-bottom:14px}
.card .go{font-size:12px;color:var(--main);font-weight:600}
.card .copy{position:absolute;top:12px;right:12px;font-size:11px;color:#889;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer}
.card .copy:hover{color:var(--main);border-color:var(--main)}
footer{margin-top:40px;font-size:12px;color:#aab}
</style>
</head>
<body>
<h1>工作台</h1>
<div class="sub">点卡片直达 · 点复制分享对应链接</div>
<div class="grid" id="grid"></div>
<footer>工作台入口 · 加新系统在下方 LINKS 里加一行即可</footer>
<script>
var LINKS=[
 {name:"在线考试系统",desc:"学生答题 · 试卷管理 · 成绩分析看板",url:"https://phgithum.github.io/quiz/"},
 {name:"聚合后台",desc:"账户签发 · 游客授权 · 各系统管理入口",url:"https://phgithum.github.io/admin-console/"},
 {name:"知识库",desc:"客服知识库前台（游客可试用）",url:"https://zhishiku.phwork.qd.je"},
 {name:"MUJI 知识库",desc:"MUJI 客服知识库",url:"https://mjzsk.phwork.qd.je"},
 {name:"看护记录",desc:"排班 · 交接班 · 护理记录",url:"https://phgithum.github.io/care-logs/"},
 {name:"定时提醒后台",desc:"看护任务与交接班提醒配置",url:"https://phgithum.github.io/care-logs/admin.html"}
];
var grid=document.getElementById("grid");
LINKS.forEach(function(l){
  var d=document.createElement("div");
  d.className="card";
  d.innerHTML='<span class="copy">复制链接</span><div class="name">'+l.name+'</div><div class="desc">'+l.desc+'</div><div class="go">进入 →</div>';
  d.onclick=function(e){
    if(e.target.className==="copy"){
      e.stopPropagation();
      (navigator.clipboard?navigator.clipboard.writeText(l.url):Promise.reject()).then(function(){e.target.textContent="已复制";setTimeout(function(){e.target.textContent="复制链接"},1200)}).catch(function(){prompt("复制此链接：",l.url)});
      return;
    }
    window.open(l.url,"_blank");
  };
  grid.appendChild(d);
});
</script>
</body>
</html>
