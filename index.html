<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 入口导航</title>
<style>
:root{--main:#2456c4;--line:#e5e8ef;--bg:#f5f7fa;--txt:#333}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
.sub{font-size:13px;color:#889;margin-bottom:20px;text-align:center}
h2{font-size:13px;color:#889;font-weight:600;width:100%;max-width:960px;margin:18px 0 10px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;width:100%;max-width:960px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:all .18s;position:relative;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--main);transform:translateY(-3px);box-shadow:0 8px 20px rgba(36,86,196,.1)}
.card .name{font-size:15px;font-weight:700;margin-bottom:5px;padding-right:64px}
.card .desc{font-size:12px;color:#889;line-height:1.6;margin-bottom:10px;word-break:break-all}
.card .go{font-size:12px;color:var(--main);font-weight:600}
.card .copy{position:absolute;top:12px;right:12px;font-size:11px;color:#889;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer}
.card .copy:hover{color:var(--main);border-color:var(--main)}
.badge{display:inline-block;font-size:10px;color:#889;background:#f0f2f6;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.muted{font-size:12px;color:#aab;width:100%;max-width:960px}
.topbar{width:100%;max-width:960px;display:flex;justify-content:flex-end;margin-bottom:8px;gap:8px}
.tbtn{font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#667;cursor:pointer}
.tbtn:hover{border-color:var(--main);color:var(--main)}
body.editing .tbtn.edit{background:var(--main);color:#fff;border-color:var(--main)}
body.editing .card{cursor:grab;border-style:dashed}
body.editing .card:hover{transform:none}
body.editing .card .copy{display:none}
.card .hidebtn{display:none;position:absolute;top:12px;right:12px;font-size:11px;color:#d33;background:#fff;border:1px solid #eec;border-radius:6px;padding:3px 8px;cursor:pointer}
body.editing .card .hidebtn{display:block}
.card.dragging{opacity:.4}
.card.dragover{border-color:var(--main);border-width:2px}
.addform{display:none;width:100%;max-width:960px;background:#fff;border:1px dashed var(--main);border-radius:12px;padding:16px;margin-bottom:10px;gap:10px;flex-wrap:wrap}
body.editing .addform{display:flex}
.addform input{flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;outline:none}
.addform button{padding:8px 18px;border:none;border-radius:8px;background:var(--main);color:#fff;font-size:13px;cursor:pointer}
footer{margin-top:36px;font-size:12px;color:#aab;text-align:center;line-height:1.8}
</style>
</head>
<body>
<h1>工作台</h1>
<div class="sub">GitHub 站点自动识别 · 点右上「编辑」可拖动排序/改名/隐藏/添加链接（保存在本机浏览器）</div>
<div class="topbar">
  <button class="tbtn edit" onclick="toggleEdit()">✏️ 编辑</button>
  <button class="tbtn" id="resetBtn" style="display:none" onclick="resetAll()">还原默认</button>
  <button class="tbtn" id="globalBtn" style="display:none;background:#18a058;color:#fff;border-color:#18a058" onclick="saveGlobal()">☁ 保存为全局</button>
</div>
<div class="addform">
  <input id="afName" placeholder="名称（如：腾讯托管站）">
  <input id="afUrl" placeholder="链接（https:// 开头）">
  <button onclick="addCustom()">添加</button>
</div>
<h2>自定义域名 / 其他托管站点</h2>
<div class="grid" id="gCustom"></div>
<h2>GitHub Pages 站点 <span class="badge">自动识别</span></h2>
<div class="grid" id="gAuto"></div>
<div class="muted" id="autoMsg">正在扫描你名下的 GitHub Pages 站点…</div>
<footer>工作台入口 · 编辑结果只保存在当前浏览器（清除浏览器数据会还原）<br>要改全局默认（所有人看到），跟我说改 OTHERS 数组即可</footer>
<script>
var GITHUB_NAME="phgithum";
var OTHERS=[
 {name:"知识库（自定义域名）",desc:"客服知识库前台 · 游客可试用",url:"https://zhishiku.phwork.qd.je"},
 {name:"MUJI 知识库",desc:"MUJI 客服知识库（自定义域名）",url:"https://mjzsk.phwork.qd.je"}
];
var CUSTOM_DOMAINS={"360-kb":"https://zhishiku.phwork.qd.je","MUJI":"https://mjzsk.phwork.qd.je"};
var SS="portal_layout_v1";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
var GLOBAL={};
function loadLay(){try{return JSON.parse(localStorage.getItem(SS)||"{}")}catch(e){return{}}}
function mergeLay(){
  /* 本机覆盖全局：合并出生效布局 */
  var g=GLOBAL,l=loadLay(),m={};
  m.names=Object.assign({},g.names||{},l.names||{});
  m.hidden=(l.hidden&&l.hidden.length)?l.hidden:(g.hidden||[]);
  m.customs=(g.customs||[]).concat(l.customs||[]);
  m.orderCustom=l.orderCustom&&l.orderCustom.length?l.orderCustom:(g.orderCustom||[]);
  m.orderAuto=l.orderAuto&&l.orderAuto.length?l.orderAuto:(g.orderAuto||[]);
  m.siteTitle=l.siteTitle||g.siteTitle||"";
  m._auto=l._auto||g._auto||[];
  return m;
}
function ghPutFile(path,content,cb){
  var tok=localStorage.getItem("portal_tok");
  if(!tok){tok=prompt("首次使用请粘贴你的 GitHub token（将只保存在本机浏览器）\n获取：github.com → Settings → Developer settings → Personal access tokens → 勾选 repo 权限");if(!tok)return;localStorage.setItem("portal_tok",tok)}
  var x=new XMLHttpRequest();
  x.open("GET","https://api.github.com/repos/phgithum/home/contents/"+path);
  x.setRequestHeader("Authorization","token "+tok);
  x.onload=function(){
    var sha=null;try{sha=JSON.parse(x.responseText).sha}catch(e){}
    var x2=new XMLHttpRequest();
    x2.open("PUT","https://api.github.com/repos/phgithum/home/contents/"+path);
    x2.setRequestHeader("Authorization","token "+tok);
    x2.setRequestHeader("Content-Type","application/json");
    x2.onload=function(){if(x2.status>=200&&x2.status<300){alert("已保存为全局默认，所有人打开都一样（Pages 刷新需1分钟）");cb&&cb()}else{alert("保存失败 "+x2.status+"（token 权限不足？）")}};
    x2.send(JSON.stringify({message:"layout update",branch:"main",content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),sha:sha}));
  };
  x.send();
}
function saveGlobal(){
  var l=loadLay();
  var out={siteTitle:l.siteTitle||"",names:l.names||{},hidden:l.hidden||[],customs:l.customs||[],orderCustom:l.orderCustom||[],orderAuto:l.orderAuto||[]};
  ghPutFile("layout.json",out,function(){});
}
function saveLay(l){try{localStorage.setItem(SS,JSON.stringify(l))}catch(e){}}
function toggleEdit(){
  document.body.classList.toggle("editing");
  var on=document.body.classList.contains("editing");
  document.querySelector(".tbtn.edit").textContent=on?"✅ 完成编辑":"✏️ 编辑";
  document.getElementById("resetBtn").style.display=on?"":"none";
  document.getElementById("globalBtn").style.display=on?"":"none";
}
function resetAll(){if(confirm("恢复默认排版？拖的顺序、改名、隐藏和自定义链接都会清除。")){localStorage.removeItem(SS);location.reload()}}
var ALL={};
function regItem(it){ALL[it.url]=it}
function renderCard(it,target){
  var lay=mergeLay();
  if((lay.hidden||[]).indexOf(it.url)>=0)return;
  var d=document.createElement("div");
  d.className="card";d.draggable=document.body.classList.contains("editing");
  d.dataset.url=it.url;
  var name=mergeLay().names[it.url]||it.name;
  d.innerHTML='<button class="hidebtn" title="隐藏">隐藏</button><span class="copy">复制链接</span><div class="name">'+esc(name)+'<span class="badge">'+(it.tag||"")+'</span></div><div class="desc">'+esc(it.desc||it.url)+'</div><div class="go">进入 →</div>';
  d.onclick=function(e){
    if(e.target.className==="hidebtn"){hideCard(it.url);return}
    if(e.target.className==="copy"){
      e.stopPropagation();
      (navigator.clipboard?navigator.clipboard.writeText(it.url):Promise.reject()).then(function(){e.target.textContent="已复制";setTimeout(function(){e.target.textContent="复制链接"},1200)}).catch(function(){prompt("复制此链接：",it.url)});
      return;
    }
    if(document.body.classList.contains("editing"))return;
    window.open(it.url,"_blank");
  };
  d.ondblclick=function(e){
    if(!document.body.classList.contains("editing"))return;
    var n=prompt("修改名称：",name);
    if(n){var l=loadLay();l.names=l.names||{};l.names[it.url]=n;saveLay(l);location.reload()}
  };
  d.ondragstart=function(e){e.dataTransfer.setData("text",it.url);d.classList.add("dragging")};
  d.ondragend=function(){d.classList.remove("dragging");persistOrder(target)};
  d.ondragover=function(e){e.preventDefault();d.classList.add("dragover")};
  d.ondragleave=function(){d.classList.remove("dragover")};
  d.ondrop=function(e){
    e.preventDefault();d.classList.remove("dragover");
    var src=e.dataTransfer.getData("text");
    if(src===it.url)return;
    var s=[].slice.call(target.children).filter(function(x){return x.dataset.url===src})[0];
    if(s)target.insertBefore(s,d);
  };
  target.appendChild(d);
}
function persistOrder(grid){
  var lay=loadLay();
  var urls=[].slice.call(grid.children).map(function(x){return x.dataset.url}).filter(Boolean);
  lay[grid.id==="gCustom"?"orderCustom":"orderAuto"]=urls;saveLay(lay);
}
function hideCard(url){
  var l=loadLay();l.hidden=l.hidden||[];
  if(l.hidden.indexOf(url)<0)l.hidden.push(url);
  saveLay(l);location.reload();
}
function applyOrder(grid,key){
  var lay=loadLay();var order=lay[key]||[];
  order.forEach(function(u){
    var el=[].slice.call(grid.children).filter(function(x){return x.dataset.url===u})[0];
    if(el)grid.appendChild(el);
  });
}
function addCustom(){
  var n=document.getElementById("afName").value.trim(),u=document.getElementById("afUrl").value.trim();
  if(!n||!/^https?:\/\//.test(u)){alert("请填写名称和以 https:// 开头的链接");return}
  var l=loadLay();l.customs=l.customs||[];l.customs.push({name:n,desc:"自定义链接",url:u});saveLay(l);location.reload();
}
function renderAll(){
  var gC=document.getElementById("gCustom");
  var lay=mergeLay();
  OTHERS.forEach(regItem);
  (lay.customs||[]).forEach(regItem);
  (lay.customs||[]).forEach(function(c){renderCard(c,gC)});
  OTHERS.forEach(function(c){renderCard(c,gC)});
  applyOrder(gC,"orderCustom");
}
function drawAuto(list,msg){
  var gA=document.getElementById("gAuto");
  list.forEach(function(c){regItem(c);renderCard(c,gA)});
  applyOrder(gA,"orderAuto");
  document.getElementById("autoMsg").textContent=msg;
}
function fetchAuto(){
  var lay=loadLay();
  fetch("https://api.github.com/users/"+GITHUB_NAME+"/repos?per_page=100&sort=updated&t="+Date.now())
    .then(function(r){return r.ok?r.json():[]})
    .then(function(repos){
      var list=(repos||[]).filter(function(r){return r.has_pages}).map(function(r){
        var url=CUSTOM_DOMAINS[r.name]||r.homepage||("https://"+GITHUB_NAME+".github.io/"+r.name+"/");
        if(url.indexOf("http")!==0)url="https://"+url;
        return {name:r.name,desc:r.description||"GitHub Pages 站点",url:url,tag:"Pages"};
      });
      list.push({name:"care-logs/admin",desc:"看护任务与交接班提醒配置页",url:"https://phgithum.github.io/care-logs/admin.html",tag:"子页面"});
      try{lay._auto=list;saveLay(lay)}catch(e){}
      drawAuto(list,"已自动识别 "+list.length+" 个 GitHub Pages 站点");
    })
    .catch(function(){drawAuto(lay._auto||[],"GitHub 扫描失败（网络原因），显示上次缓存")});
}
fetch("https://raw.githubusercontent.com/phgithum/home/main/layout.json?t="+Date.now())
  .then(function(r){return r.ok?r.json():{}})
  .then(function(g){GLOBAL=g||{};boot()})
  .catch(function(){boot()});
function boot(){
  var m=mergeLay();
  if(m.siteTitle){document.querySelector("h1").textContent=m.siteTitle;document.title=m.siteTitle+" · 入口导航"}
  renderAll();
  if(m._auto){drawAuto(m._auto,"已加载缓存站点列表");fetchAuto()}
  else fetchAuto();
}
</script>
</body>
</html>
